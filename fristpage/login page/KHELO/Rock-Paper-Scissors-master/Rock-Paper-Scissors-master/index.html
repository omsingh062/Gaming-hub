<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Rock Paper Scissors</h1>

    <div class="scoreboard">
      <div class="player">
        <h2>You</h2>
        <img id="your-choice" src="placeholder.png" alt="Your choice">
        <p id="your-score">0</p>
      </div>
      <div class="vs">VS</div>
      <div class="player">
        <h2>Opponent</h2>
        <img id="opponent-choice" src="placeholder.png" alt="Opponent choice">
        <p id="opponent-score">0</p>
      </div>
    </div>

    <div class="choices" id="choices">
      <!-- Choices generated by JavaScript -->
    </div>

    <p id="result-text"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
